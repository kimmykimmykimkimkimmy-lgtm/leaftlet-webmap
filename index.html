<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leaflet 2.0 Map Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet 2.0.0-beta.3 CSS -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    #info-banner {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #333;
    }
    .custom-pin {
      background: transparent;
      border: none;
    }
  </style>
</head>
<body>

  <div id="info-banner">Loading points...</div>
  <div id="map"></div>


  <script>
    // 1. Initialize map
    const map = new L.Map('map').setView(new L.LatLng(22.2819, 114.1589), 13);

    // OpenStreetMap tile layer
      new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
    }).addTo(map);
    
    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function parseColor(rawColor) {
      if (!rawColor) return '#3388ff';
      const cleaned = rawColor.trim();
      const candidate = /^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(cleaned) 
        ? `#${cleaned}` 
        : cleaned;
      
      const testEl = new Option().style;
      testEl.color = candidate;
      return testEl.color !== '' ? candidate : '#3388ff';
    }

    function createColoredIcon(color) {
      const svgPin = `
        <svg xmlns="http://w3.org" viewBox="0 0 24 36" width="28" height="42">
          <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24c0-6.6-5.4-12-12-12z" 
                fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4.5" fill="#ffffff"/>
        </svg>`;
      
      return new L.DivIcon({
        html: svgPin,
        className: 'custom-pin',
        iconSize: new L.Point(28, 42),
        iconAnchor: new L.Point(14, 42),
        popupAnchor: new L.Point(0, -38)
      });
    }

    function decodeText(str) {
      if (!str) return '';
      try {
        return decodeURIComponent(str.replace(/\+/g, ' '));
      } catch (e) {
        return str.replace(/\+/g, ' ');
      }
    }

    function renderPoints() {
      if (window.markerLayer) {
        map.removeLayer(window.markerLayer);
      }
      window.markerLayer = new L.LayerGroup().addTo(map);

      const rawHash = window.location.hash.substring(1).trim();
      const banner = document.getElementById('info-banner');

      if (!rawHash) {
        banner.innerHTML = 'Append <code>#lat|lng|radius|color|Name|Region</code> to URL.';
        return;
      }

      // Split multiple points by '~'
      const entries = rawHash.split('~');
      const allBounds = new L.LatLngBounds();
      let validCount = 0;

      entries.forEach((entry, index) => {
        // Split fields by '|': lat|lng|radius|color|spot_name|region
        const parts = entry.split(',');
        if (parts.length >= 2) {
          const lat = parseFloat((parts.at(0) || '').trim());
          const lng = parseFloat((parts.at(1) || '').trim());
          
          const radiusVal = parts.at(2) !== undefined ? parseFloat(parts.at(2).trim()) : 0;
          const radius = !isNaN(radiusVal) && radiusVal > 0 ? radiusVal : 0;

          const color = parseColor(parts.at(3));
          
          const rawName = decodeText(parts.at(4)).trim();
          const label = rawName ? escapeHTML(rawName) : `Point ${index + 1}`;

          const rawRegion = decodeText(parts.at(5)).trim();
          const regionText = rawRegion ? `<br>Region: ${escapeHTML(rawRegion)}` : '';

          if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            const pointLatLng = new L.LatLng(lat, lng);
            const radiusText = radius > 0 ? `<br>Radius: ${radius}m` : '';

            new L.Marker(pointLatLng, { icon: createColoredIcon(color) })
              .bindPopup(`<b>${label}</b>${regionText}${radiusText}<br><small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>`)
              .addTo(window.markerLayer);

            allBounds.extend(pointLatLng);

            if (radius > 0) {
              const circle = new L.Circle(pointLatLng, {
                radius: radius,
                color: color,
                fillColor: color,
                fillOpacity: 0.2,
                weight: 2
              }).addTo(window.markerLayer);

              allBounds.extend(circle.getBounds());
            }

            validCount++;
          }
        }
      });

      if (validCount > 0) {
        banner.textContent = `Showing ${validCount} location${validCount > 1 ? 's' : ''}`;
        map.fitBounds(allBounds, { padding: new L.Point(50, 50), maxZoom: 16 });
      } else {
        banner.textContent = 'No valid coordinates found in URL.';
      }
    }

    renderPoints();
    window.addEventListener('hashchange', renderPoints);
  </script>
</body>
</html>
